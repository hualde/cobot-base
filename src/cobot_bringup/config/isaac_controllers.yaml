# Controladores para el Controller Manager que corre DENTRO de Isaac Sim (extensión isaacsim.ros2.control).
# Se pasa al nodo ROS2ControlManager como controllerConfig.
controller_manager:
  ros__parameters:
    update_rate: 60  # Hz; Isaac lo limita a la frecuencia de física

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # MoveIt (ur_moveit_config) ejecuta por defecto sobre "scaled_joint_trajectory_controller".
    # El tipo escalado de UR necesita la interfaz speed_scaling del robot real, que Isaac no tiene,
    # así que en simulación usamos el JTC estándar con ese mismo nombre.
    scaled_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
